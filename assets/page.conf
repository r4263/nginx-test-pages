
location = / {
    root /usr/share/nginx/html;
    default_type text/html;

    sub_filter_once off;

    # Request
    sub_filter '{{NGINX_REQUEST}}' '$request';
    sub_filter '{{NGINX_REQUEST_METHOD}}' '$request_method';
    sub_filter '{{NGINX_REQUEST_URI}}' '$request_uri';
    sub_filter '{{NGINX_URI}}' '$uri';
    sub_filter '{{NGINX_ARGS}}' '$args';
    sub_filter '{{NGINX_QUERY_STRING}}' '$query_string';
    sub_filter '{{NGINX_SERVER_PROTOCOL}}' '$server_protocol';
    sub_filter '{{NGINX_SCHEME}}' '$scheme';
    sub_filter '{{NGINX_REQUEST_LENGTH}}' '$request_length';
    sub_filter '{{NGINX_CONTENT_LENGTH}}' '$content_length';
    sub_filter '{{NGINX_HTTP_CONTENT_TYPE}}' '$http_content_type';
    sub_filter '{{NGINX_HTTP_CONTENT_ENCODING}}' '$http_content_encoding';
    sub_filter '{{NGINX_HTTP_TRANSFER_ENCODING}}' '$http_transfer_encoding';
    sub_filter '{{NGINX_HTTP_ACCEPT}}' '$http_accept';
    sub_filter '{{NGINX_HTTP_ACCEPT_ENCODING}}' '$http_accept_encoding';
    sub_filter '{{NGINX_HTTP_ACCEPT_LANGUAGE}}' '$http_accept_language';
    sub_filter '{{NGINX_HTTP_AUTHORIZATION}}' '$http_authorization';
    sub_filter '{{NGINX_HTTP_COOKIE}}' '$http_cookie';
    sub_filter '{{NGINX_HTTP_REFERER}}' '$http_referer';
    sub_filter '{{NGINX_HTTP_USER_AGENT}}' '$http_user_agent';
    sub_filter '{{NGINX_HTTP_ORIGIN}}' '$http_origin';
    sub_filter '{{NGINX_HTTP_CONNECTION}}' '$http_connection';
    sub_filter '{{NGINX_HTTP_KEEP_ALIVE}}' '$http_keep_alive';
    sub_filter '{{NGINX_HTTP_UPGRADE}}' '$http_upgrade';
    sub_filter '{{NGINX_HTTP_EXPECT}}' '$http_expect';
    sub_filter '{{NGINX_HTTP_HOST}}' '$http_host';
    sub_filter '{{NGINX_HTTP_TE}}' '$http_te';
    sub_filter '{{NGINX_HTTP_VIA}}' '$http_via';

    # Client and connection
    sub_filter '{{NGINX_REMOTE_ADDR}}' '$remote_addr';
    sub_filter '{{NGINX_REMOTE_PORT}}' '$remote_port';
    sub_filter '{{NGINX_REMOTE_USER}}' '$remote_user';
    sub_filter '{{NGINX_SERVER_ADDR}}' '$server_addr';
    sub_filter '{{NGINX_SERVER_PORT}}' '$server_port';
    sub_filter '{{NGINX_SERVER_NAME}}' '$server_name';
    sub_filter '{{NGINX_HOST}}' '$host';
    sub_filter '{{NGINX_HOSTNAME}}' '$hostname';
    sub_filter '{{NGINX_CONNECTION}}' '$connection';
    sub_filter '{{NGINX_CONNECTION_REQUESTS}}' '$connection_requests';
    sub_filter '{{NGINX_BINARY_REMOTE_ADDR}}' '$binary_remote_addr';
    sub_filter '{{NGINX_REALIP_REMOTE_ADDR}}' '$realip_remote_addr';
    sub_filter '{{NGINX_REALIP_REMOTE_PORT}}' '$realip_remote_port';

    # Reverse proxy
    sub_filter '{{NGINX_HTTP_X_FORWARDED_FOR}}' '$http_x_forwarded_for';
    sub_filter '{{NGINX_HTTP_X_REAL_IP}}' '$http_x_real_ip';
    sub_filter '{{NGINX_HTTP_FORWARDED}}' '$http_forwarded';
    sub_filter '{{NGINX_HTTP_X_FORWARDED_HOST}}' '$http_x_forwarded_host';
    sub_filter '{{NGINX_HTTP_X_FORWARDED_PROTO}}' '$http_x_forwarded_proto';
    sub_filter '{{NGINX_HTTP_X_FORWARDED_PORT}}' '$http_x_forwarded_port';
    sub_filter '{{NGINX_HTTP_X_FORWARDED_SERVER}}' '$http_x_forwarded_server';
    sub_filter '{{NGINX_HTTP_X_FORWARDED_PREFIX}}' '$http_x_forwarded_prefix';
    sub_filter '{{NGINX_HTTP_X_FORWARDED_URI}}' '$http_x_forwarded_uri';
    sub_filter '{{NGINX_HTTP_X_ORIGINAL_URI}}' '$http_x_original_uri';
    sub_filter '{{NGINX_HTTP_X_ORIGINAL_URL}}' '$http_x_original_url';
    sub_filter '{{NGINX_HTTP_X_ORIGINAL_HOST}}' '$http_x_original_host';
    sub_filter '{{NGINX_HTTP_X_ORIGINAL_FORWARDED_FOR}}' '$http_x_original_forwarded_for';
    sub_filter '{{NGINX_HTTP_PROXY_AUTHORIZATION}}' '$http_proxy_authorization';
    sub_filter '{{NGINX_HTTP_PROXY_CONNECTION}}' '$http_proxy_connection';

    # CDN and tracing
    sub_filter '{{NGINX_HTTP_CF_CONNECTING_IP}}' '$http_cf_connecting_ip';
    sub_filter '{{NGINX_HTTP_CF_CONNECTING_IPV6}}' '$http_cf_connecting_ipv6';
    sub_filter '{{NGINX_HTTP_CF_RAY}}' '$http_cf_ray';
    sub_filter '{{NGINX_HTTP_CF_IPCOUNTRY}}' '$http_cf_ipcountry';
    sub_filter '{{NGINX_HTTP_TRUE_CLIENT_IP}}' '$http_true_client_ip';
    sub_filter '{{NGINX_HTTP_X_CLIENT_IP}}' '$http_x_client_ip';
    sub_filter '{{NGINX_HTTP_X_CLUSTER_CLIENT_IP}}' '$http_x_cluster_client_ip';
    sub_filter '{{NGINX_HTTP_X_ENVOY_EXTERNAL_ADDRESS}}' '$http_x_envoy_external_address';
    sub_filter '{{NGINX_HTTP_X_REQUEST_ID}}' '$http_x_request_id';
    sub_filter '{{NGINX_HTTP_X_CORRELATION_ID}}' '$http_x_correlation_id';
    sub_filter '{{NGINX_HTTP_TRACEPARENT}}' '$http_traceparent';
    sub_filter '{{NGINX_HTTP_TRACESTATE}}' '$http_tracestate';
    sub_filter '{{NGINX_HTTP_X_B3_TRACEID}}' '$http_x_b3_traceid';
    sub_filter '{{NGINX_HTTP_X_B3_SPANID}}' '$http_x_b3_spanid';
    sub_filter '{{NGINX_HTTP_X_REQUEST_START}}' '$http_x_request_start';
    sub_filter '{{NGINX_HTTP_X_AMZN_TRACE_ID}}' '$http_x_amzn_trace_id';

    # Nginx metadata
    sub_filter '{{NGINX_REQUEST_ID}}' '$request_id';
    sub_filter '{{NGINX_REQUEST_COMPLETION}}' '$request_completion';
    sub_filter '{{NGINX_DOCUMENT_ROOT}}' '$document_root';
    sub_filter '{{NGINX_REQUEST_FILENAME}}' '$request_filename';
    sub_filter '{{NGINX_LIMIT_RATE}}' '$limit_rate';
    sub_filter '{{NGINX_SENT_HTTP_CONTENT_TYPE}}' '$sent_http_content_type';
    sub_filter '{{NGINX_SENT_HTTP_CONTENT_LENGTH}}' '$sent_http_content_length';
    sub_filter '{{NGINX_SENT_HTTP_CACHE_CONTROL}}' '$sent_http_cache_control';
    sub_filter '{{NGINX_SENT_HTTP_LOCATION}}' '$sent_http_location';
    sub_filter '{{NGINX_SENT_HTTP_SERVER}}' '$sent_http_server';
    sub_filter '{{NGINX_SENT_HTTP_X_REQUEST_ID}}' '$sent_http_x_request_id';

    # TLS
    sub_filter '{{NGINX_SSL_PROTOCOL}}' '$ssl_protocol';
    sub_filter '{{NGINX_SSL_CIPHER}}' '$ssl_cipher';
    sub_filter '{{NGINX_SSL_SERVER_NAME}}' '$ssl_server_name';
    sub_filter '{{NGINX_SSL_SESSION_REUSED}}' '$ssl_session_reused';
    sub_filter '{{NGINX_SSL_CLIENT_VERIFY}}' '$ssl_client_verify';
    sub_filter '{{NGINX_SSL_CLIENT_S_DN}}' '$ssl_client_s_dn';
    sub_filter '{{NGINX_SSL_CLIENT_I_DN}}' '$ssl_client_i_dn';
    sub_filter '{{NGINX_SSL_CLIENT_SERIAL}}' '$ssl_client_serial';
    sub_filter '{{NGINX_SSL_CLIENT_FINGERPRINT}}' '$ssl_client_fingerprint';

    # Upstream
    sub_filter '{{NGINX_UPSTREAM_ADDR}}' '$upstream_addr';
    sub_filter '{{NGINX_UPSTREAM_STATUS}}' '$upstream_status';
    sub_filter '{{NGINX_UPSTREAM_RESPONSE_TIME}}' '$upstream_response_time';
    sub_filter '{{NGINX_UPSTREAM_CONNECT_TIME}}' '$upstream_connect_time';
    sub_filter '{{NGINX_UPSTREAM_HEADER_TIME}}' '$upstream_header_time';
    sub_filter '{{NGINX_UPSTREAM_RESPONSE_LENGTH}}' '$upstream_response_length';
    sub_filter '{{NGINX_UPSTREAM_BYTES_RECEIVED}}' '$upstream_bytes_received';
    sub_filter '{{NGINX_UPSTREAM_BYTES_SENT}}' '$upstream_bytes_sent';
    sub_filter '{{NGINX_UPSTREAM_HTTP_VERSION}}' '$upstream_http_version';
    sub_filter '{{NGINX_UPSTREAM_CACHE_STATUS}}' '$upstream_cache_status';

    # WebSocket, fetch and client hints
    sub_filter '{{NGINX_HTTP_SEC_WEBSOCKET_KEY}}' '$http_sec_websocket_key';
    sub_filter '{{NGINX_HTTP_SEC_WEBSOCKET_VERSION}}' '$http_sec_websocket_version';
    sub_filter '{{NGINX_HTTP_SEC_WEBSOCKET_PROTOCOL}}' '$http_sec_websocket_protocol';
    sub_filter '{{NGINX_HTTP_SEC_WEBSOCKET_EXTENSIONS}}' '$http_sec_websocket_extensions';
    sub_filter '{{NGINX_HTTP_SEC_FETCH_SITE}}' '$http_sec_fetch_site';
    sub_filter '{{NGINX_HTTP_SEC_FETCH_MODE}}' '$http_sec_fetch_mode';
    sub_filter '{{NGINX_HTTP_SEC_FETCH_DEST}}' '$http_sec_fetch_dest';
    sub_filter '{{NGINX_HTTP_SEC_FETCH_USER}}' '$http_sec_fetch_user';
    sub_filter '{{NGINX_HTTP_SEC_CH_UA}}' '$http_sec_ch_ua';
    sub_filter '{{NGINX_HTTP_SEC_CH_UA_PLATFORM}}' '$http_sec_ch_ua_platform';
    sub_filter '{{NGINX_HTTP_SEC_CH_UA_MOBILE}}' '$http_sec_ch_ua_mobile';
    sub_filter '{{NGINX_HTTP_DNT}}' '$http_dnt';
    sub_filter '{{NGINX_HTTP_PRIORITY}}' '$http_priority';

    try_files /index.html =404;
}
