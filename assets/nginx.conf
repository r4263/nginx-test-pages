events {}

http {

    server {
        listen 80;
        server_name _;

        include /etc/nginx/snippets/page.conf;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        include /etc/nginx/snippets/page.conf;
    }
}
