# docker-compose.yml
services:
  nginx:
    image: nginx:alpine
    container_name: server-test-container
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./assets/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./assets/page.html:/usr/share/nginx/html/index.html:ro
      - ./assets/page.conf:/etc/nginx/snippets/page.conf:ro
      - ./assets/entrypoint.sh:/entrypoint.sh:ro
      - ./data/certificates:/etc/nginx/certs:rw
      - /etc/timezone:/etc/timezone:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped
